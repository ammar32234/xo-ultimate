<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniKirka Online</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101923;color:#fff;font:15px Arial}
#hud{position:fixed;inset:0;pointer-events:none}
#top{display:flex;justify-content:space-between;padding:14px;gap:10px}
.panel{background:#101923d9;border:1px solid #ffffff28;border-radius:10px;padding:10px 13px}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:white;box-shadow:0 0 3px #000}
#cross:before{width:2px;height:18px;left:8px}#cross:after{height:2px;width:18px;top:8px}
#menu{position:fixed;z-index:5;inset:0;background:#07111ddd;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(440px,100%);background:#172637;border:1px solid #ffffff25;border-radius:16px;padding:24px;box-shadow:0 18px 60px #0008}
h1{margin:0 0 8px;font-size:30px}p{color:#c5d2df;line-height:1.5}
input,button{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff25;margin-top:9px;font-size:16px}
input{background:#0b1723;color:#fff}button{background:#31b7ff;color:#06131e;font-weight:bold;cursor:pointer;border:0}
button.secondary{background:#34495e;color:white}#status{min-height:24px;color:#ffd166;margin-top:8px}
#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;color:#e8f2ff;background:#101923bb;padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<div id="menu"><div class="card">
<h1>MiniKirka <span style="color:#31b7ff">ONLINE</span></h1>
<p>لعبة تصويب 3D خفيفة بالمتصفح. أنشئ غرفة وابعث كودها لصاحبك، أو ادخل غرفة موجودة.</p>
<input id="name" maxlength="14" placeholder="اسم اللاعب" value="Player">
<button id="host">إنشاء غرفة (Host)</button>
<input id="room" placeholder="كود الغرفة / Room ID">
<button class="secondary" id="join">دخول الغرفة (Join)</button>
<div id="status">بعد دخول اللعبة اضغط داخل الشاشة لتفعيل الماوس.</div>
</div></div>
<div id="hud">
<div id="top"><div class="panel">❤️ <b id="hp">100</b>　🔫 <b id="ammo">∞</b></div><div class="panel">الغرفة: <b id="roomlabel">—</b>　اللاعبون: <b id="count">1</b></div></div>
<div id="cross"></div><div id="help">WASD حركة · Space قفز · Mouse تصويب · Click إطلاق · Esc تحرير الماوس</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=> {
const menu=document.querySelector('#menu'), status=document.querySelector('#status');
let scene,camera,renderer,peer,host=false,roomId='',connections=[],players={},myId='',myName='Player';
let running=false,hp=100,keys={},yaw=0,pitch=0,velY=0,onGround=true,lastShot=0,lastSend=0;
const clock=new THREE.Clock(), raycaster=new THREE.Raycaster();
const arena=[];
function say(s){status.textContent=s}
function makeWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9d9);scene.fog=new THREE.Fog(0x87b9d9,35,100);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);camera.position.set(0,2,8);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x526477,2));
 const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,5);scene.add(sun);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(60,1,60),new THREE.MeshStandardMaterial({color:0x526b56}));floor.position.y=-.5;scene.add(floor);
 const grid=new THREE.GridHelper(60,30,0x263f35,0x6b886e);grid.position.y=.02;scene.add(grid);
 const mat=new THREE.MeshStandardMaterial({color:0x687d91});
 // arena perimeter + cover blocks
 for(let i=-1;i<=1;i++){addBox(i*18,2,-29,18,4,2,0x435567);addBox(i*18,2,29,18,4,2,0x435567)}
 for(let i=-1;i<=1;i++){addBox(-29,2,i*18,2,4,18,0x435567);addBox(29,2,i*18,2,4,18,0x435567)}
 const colors=[0x5bc0eb,0xf25f5c,0xffca3a,0x9b5de5,0x00bb8e,0xff7b00];
 for(let i=0;i<12;i++){let x=(Math.random()-.5)*42,z=(Math.random()-.5)*42;addBox(x,1,z,2.5,2,2.5,colors[i%colors.length])}
 // weapon
 const gun=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.22,.18,.7),new THREE.MeshStandardMaterial({color:0x20242b}));body.position.set(.35,-.28,-.55);gun.add(body);
 const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.35,8),new THREE.MeshStandardMaterial({color:0x111111}));barrel.rotation.x=Math.PI/2;barrel.position.set(.35,-.25,-.95);gun.add(barrel);camera.add(gun);scene.add(camera);
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 animate();
}
function addBox(x,y,z,w,h,d,color){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));m.position.set(x,y,z);scene.add(m);arena.push(m);return m}
function createPlayer(id,name,color=0xf25f5c){
 let g=new THREE.Group();let m=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1,4,8),new THREE.MeshStandardMaterial({color}));m.position.y=.95;g.add(m);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),new THREE.MeshStandardMaterial({color:0xffd1a4}));head.position.y=1.8;g.add(head);
 scene.add(g);return {group:g,name,mesh:m,hp:100,lastHit:0};
}
function startNetwork(isHost){
 host=isHost;myName=(document.querySelector('#name').value.trim()||'Player').slice(0,14);
 say('جاري الاتصال…');
 peer=new Peer();
 peer.on('open',id=>{
  myId=id;
  if(host){roomId=id;document.querySelector('#roomlabel').textContent=roomId;document.querySelector('#room').value=roomId;setupGame();}
  else {roomId=document.querySelector('#room').value.trim();if(!roomId){say('اكتب كود الغرفة أولاً');peer.destroy();return}let c=peer.connect(roomId,{reliable:true});wire(c,true);}
 });
 peer.on('connection',c=>wire(c,false));
 peer.on('error',e=>say('خطأ اتصال: '+e.type+' — جرّب إعادة الدخول'));
}
function wire(c,joining){
 c.on('open',()=>{
  connections.push(c);
  c.on('data',data=>handleData(c,data));
  if(joining)c.send({t:'hello',id:myId,name:myName,x:0,z:5});
  else c.send({t:'welcome',id:myId,name:myName,x:0,z:5,players:Object.values(players).map(p=>({id:p.id,name:p.name,x:p.x,z:p.z,yaw:p.yaw||0,hp:p.hp||100}))});
  if(host&&joining){players[myId] ||= {id:myId,name:myName,x:0,z:8,hp:100};}
 });
 c.on('close',()=>{connections=connections.filter(x=>x!==c);});
}
function handleData(c,d){
 if(!d||!d.t)return;
 if(d.t==='hello'){
  if(!host)return;
  players[d.id]={id:d.id,name:d.name,x:d.x||0,z:d.z||5,yaw:0,hp:100};
  c.send({t:'welcome',id:myId,name:myName,x:0,z:8,players:Object.values(players).filter(p=>p.id!==d.id)});
  broadcast({t:'join',id:d.id,name:d.name,x:d.x||0,z:d.z||5});
 }else if(d.t==='welcome'){
  if(!players[d.id])players[d.id]={id:d.id,name:d.name,x:d.x||0,z:d.z||5,yaw:0,hp:100};
  (d.players||[]).forEach(p=>{if(p.id!==myId)players[p.id]=p});
  setupGame();
 }else if(d.t==='join'){players[d.id]={...d,hp:100};}
 else if(d.t==='state'){players[d.id]={...(players[d.id]||{}),...d};if(host)connections.forEach(other=>{if(other!==c&&other.open)other.send(d)});}
 else if(d.t==='shot'){if(d.id!==myId)remoteShot(d);}
 else if(d.t==='hit'){if(d.target===myId){hp=Math.max(0,hp-d.damage);document.querySelector('#hp').textContent=hp;if(hp<=0)setTimeout(()=>{hp=100;camera.position.set(0,2,8);document.querySelector('#hp').textContent=hp},1300)}}
 else if(d.t==='leave'){delete players[d.id];}
}
function broadcast(d){connections.forEach(c=>{if(c.open)c.send(d)})}
function setupGame(){
 if(running)return;running=true;menu.style.display='none';makeWorld();
 if(!players[myId])players[myId]={id:myId,name:myName,x:0,z:8,yaw:0,hp:100};
 Object.values(players).forEach(p=>{if(p.id!==myId&&!p.group)p.group=createPlayer(p.id,p.name).group});
 document.querySelector('#roomlabel').textContent=roomId;
 document.querySelector('#count').textContent=Object.keys(players).length;
 renderer.domElement.addEventListener('click',()=>{if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();else shoot()});
 document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch));camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0)}});
 document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&onGround){velY=7.5;onGround=false}});
 document.addEventListener('keyup',e=>keys[e.code]=false);
 say('');
}
function shoot(){
 let now=performance.now();if(now-lastShot<220)return;lastShot=now;
 // local ray checks remote player bodies
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);let best=null,dist=30;
 Object.values(players).forEach(p=>{if(p.id===myId||!p.group)return;let box=new THREE.Box3().setFromObject(p.group);let hit=raycaster.ray.intersectBox(box,new THREE.Vector3());if(hit){let d=hit.distanceTo(camera.position);if(d<dist){dist=d;best=p}}});
 if(best){if(host){best.hp=(best.hp||100)-25;if(best.hp<=0){best.hp=100;best.x=(Math.random()-.5)*15;best.z=(Math.random()-.5)*15;if(best.group)best.group.position.set(best.x,0,best.z)}broadcast({t:'hit',target:best.id,damage:25,from:myId})}
 else {broadcast({t:'shot',id:myId,target:best.id,damage:25,ox:camera.position.x,oz:camera.position.z,dx:raycaster.ray.direction.x,dz:raycaster.ray.direction.z})}
 }
}
function remoteShot(d){if(!host)return;let p=players[d.id],target=players[d.target];if(!p||!target)return;
 // host validates approximate aim to avoid trusting client blindly
 let dx=(target.x||0)-(d.ox||0),dz=(target.z||0)-(d.oz||0),len=Math.hypot(dx,dz)||1;
 let dot=(dx/len)*(d.dx||0)+(dz/len)*(d.dz||0);
 if(len<35&&dot>.88){target.hp=(target.hp||100)-25;broadcast({t:'hit',target:target.id,damage:25,from:d.id});if(target.hp<=0){target.hp=100;target.x=(Math.random()-.5)*16;target.z=(Math.random()-.5)*16;broadcast({t:'state',id:target.id,x:target.x,z:target.z,hp:100})}}
}
function animate(){
 requestAnimationFrame(animate);if(!running)return;
 let dt=Math.min(clock.getDelta(),.04);
 let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);
 let speed=9,move=new THREE.Vector3(side,0,-forward).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 if(move.length()>0)move.normalize().multiplyScalar(speed*dt);
 camera.position.x+=move.x;camera.position.z+=move.z;
 // gravity/jump
 velY-=19*dt;camera.position.y+=velY*dt;if(camera.position.y<=2){camera.position.y=2;velY=0;onGround=true}
 camera.position.x=Math.max(-27,Math.min(27,camera.position.x));camera.position.z=Math.max(-27,Math.min(27,camera.position.z));
 // remote player interpolation/simple positions
 Object.values(players).forEach(p=>{if(p.id!==myId&&p.group){p.group.position.set(p.x||0,0,p.z||0);p.group.rotation.y=p.yaw||0}});
 let now=performance.now();if(now-lastSend>80){lastSend=now;let s={t:'state',id:myId,name:myName,x:camera.position.x,z:camera.position.z,yaw:yaw,hp:hp};broadcast(s);if(host)players[myId]={...s,group:null};}
 document.querySelector('#count').textContent=Object.keys(players).length;
 renderer.render(scene,camera);
}
document.querySelector('#host').onclick=()=>{if(!window.Peer){say('تحميل مكتبة الاتصال فشل. افتح الصفحة مع إنترنت.');return}startNetwork(true)};
document.querySelector('#join').onclick=()=>{if(!document.querySelector('#room').value.trim()){say('اكتب كود الغرفة');return}startNetwork(false)};
})();
</script>
</body>
</html>
